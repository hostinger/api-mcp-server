name: build-release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # npm trusted publishing trusts this whole workflow file, so any job here holding id-token: write can publish
  # the package. Only the publish jobs hold it, and besides GitHub's own actions they run no downloaded code:
  # no npm update and no dependency install (npm publish packs the files and runs no scripts), and a pinned,
  # checksummed mcp-publisher.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — skipping release."
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # The generator writes a CHANGELOG.md section per version. Lift this
      # version's section out so the release body says what changed instead of
      # only linking a compare view. Missing or empty sections are not fatal:
      # the release still gets the auto-generated notes below.
      - name: Extract release notes for this version
        if: steps.version.outputs.released == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v want="## v$VERSION " '
              index($0, want) == 1 { found = 1; next }
              found && /^## v/     { exit }
              found                { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section for v$VERSION."
            : > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create release
        if: steps.version.outputs.released == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          bodyFile: RELEASE_NOTES.md
          generateReleaseNotes: true

  publish-npmjs:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish package
        run: npm publish --provenance --access public

      # The package was published unscoped before moving to @hostinger. Republish
      # each release under the old name so existing installs keep updating.
      # Both names point their npm trusted publisher at this workflow file, which
      # is what the config keys on — the job/step it runs in is not part of it.
      # The name below is substituted by the generator, and is left empty for an
      # API that never had an unscoped package.
      - name: Publish legacy unscoped alias
        run: |
          LEGACY='hostinger-api-mcp'
          if [ -z "$LEGACY" ]; then
            echo "No legacy npm name configured — nothing to alias."
            exit 0
          fi
          jq --arg n "$LEGACY" '.name = $n' package.json > pkg.tmp && mv pkg.tmp package.json
          npm publish --provenance --access public

  release-github:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hostinger'

      - name: Publish package
        run: |
          sed -i 's+"name": ".*+"name": "@${{ github.repository }}",+gI' ./package.json
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp:
    runs-on: ubuntu-latest
    needs: [ release, publish-npmjs ]
    if: needs.release.outputs.released == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # Pinned and checksummed: this job can mint the npm publishing identity. To upgrade, take the
      # sha256 digest of mcp-publisher_linux_amd64.tar.gz from the registry release's assets.
      - name: Install MCP Publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x ./mcp-publisher

      # The registry validates the npm version in server.json by fetching
      # registry.npmjs.org/<package>/<version>, and a fresh npm publish takes
      # minutes to show up there. Poll that same URL ourselves instead of
      # retrying the publish: the registry login token expires after ~5 minutes,
      # so logging in before the wait made late retries fail with 401.
      - name: Wait for the npm version to be available
        run: |
          PKG=$(jq -r '.packages[] | select(.registryType == "npm") | .identifier' server.json)
          VERSION=$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json)
          URL="https://registry.npmjs.org/${PKG/\//%2F}/$VERSION"
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$URL"; then
              echo "$PKG@$VERSION is available on npm."
              exit 0
            fi
            echo "$PKG@$VERSION not on npm yet. Checking again in 15s."
            sleep 15
          done
          echo "$PKG@$VERSION still not on npm after 15 minutes."
          exit 1

      - name: Login to MCP Registry using GitHub OIDC
        run: ./mcp-publisher login github-oidc

      # npm is served from a CDN, so the registry's edge can lag the one we
      # polled by a little. Retry briefly, well inside the login token lifetime.
      - name: Publish to MCP Registry
        run: |
          for delay in 30 30 0; do
            if ./mcp-publisher publish; then
              exit 0
            fi
            [ "$delay" -eq 0 ] && break
            echo "Publish failed. Retrying in ${delay}s."
            sleep "$delay"
          done
          exit 1

  notify-failure:
    needs: [release, publish-npmjs, release-github, publish-mcp]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on release failure
        uses: slackapi/slack-github-action@v4.0.0
        with:
          errors: true
          webhook: ${{ secrets.PLATFORM_INCIDENT_SLACK_CHANNEL_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: ":rotating_light: Release failed in ${{ github.repository }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    :rotating_light: *Release failed:* `${{ github.repository }}`
                    *Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: "View failed run"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
